name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Explicitly install test and new AI dependencies to prevent CI drift
        pip install pylint pytest pytest-cov google-genai requests

    - name: Set up environment variables for Secrets
      run: |
        # IMPORTANT: For CI tests, explicitly set DATABASE_URL to in-memory SQLite
        echo "DATABASE_URL=sqlite:///:memory:" >> $GITHUB_ENV

        # Pulling from GitHub Repository Secrets
        echo "SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" >> $GITHUB_ENV
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> $GITHUB_ENV
        echo "IGDB_CLIENT_ID=${{ secrets.IGDB_CLIENT_ID }}" >> $GITHUB_ENV
        echo "IGDB_CLIENT_SECRET=${{ secrets.IGDB_CLIENT_SECRET }}" >> $GITHUB_ENV

    - name: Run Tests with Coverage
      env:
        PYTHONPATH: .
      run: |
        pytest tests/ --cov=. --cov-report=xml --cov-report=term-missing

    - name: Run Pylint
      run: pylint application.py routers database utils --exit-zero

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml